version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=secret
      - DB_NAME=o_cos
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=o_cos
    volumes:
      - ./db_o_cos.sql:/docker-entrypoint-initdb.d/db_o_cos.sql
      - db_data:/var/lib/mysql

volumes:
  db_data:
